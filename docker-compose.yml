version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chainlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainlearn
      POSTGRES_PASSWORD: chainlearn_dev
      POSTGRES_DB: chainlearn_indexer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlearn -d chainlearn_indexer"]
      interval: 5s
      timeout: 3s
      retries: 5

  indexer:
    build: .
    container_name: chainlearn-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chainlearn:chainlearn_dev@postgres:5432/chainlearn_indexer
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      LEARN_TOKEN_CONTRACT: ${LEARN_TOKEN_CONTRACT}
      CREDENTIAL_NFT_CONTRACT: ${CREDENTIAL_NFT_CONTRACT}
      PROGRESS_TRACKER_CONTRACT: ${PROGRESS_TRACKER_CONTRACT}
      API_PORT: ${API_PORT:-3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3100:3100"

volumes:
  pgdata:
